name: backoffice-gateway-test

services:
  mockserver:
    image: mockserver/mockserver:5.15.0
    profiles: [test]
    container_name: ${SERVICE_PREFIX:-backoffice-gateway-test}-mockserver
    ports:
      - "${MOCKSERVER_PORT:-1090}:1080"
    volumes:
      - ./MockServerHealthcheck.java:/healthcheck/MockServerHealthcheck.java:ro
    healthcheck:
      test: ["CMD", "java", "/healthcheck/MockServerHealthcheck.java"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 5s
    networks:
      - pulse-pass

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: ${SERVICE_PREFIX:-backoffice-gateway-test}-api
    env_file: .env
    environment:
      ONBOARDING_SERVICE_URL: ${ONBOARDING_SERVICE_URL:-http://backoffice-gateway-test-mockserver:1080}
    ports:
      - "${PUBLISHED_API_PORT:-8090}:8080"
    depends_on:
      mockserver:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - pulse-pass

networks:
  pulse-pass:
    external: true
