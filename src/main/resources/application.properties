spring.application.name=backoffice-gateway

spring.jackson.property-naming-strategy=SNAKE_CASE

spring.messages.basename=messages
spring.messages.fallback-to-system-locale=false

management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.probes.enabled=true

app.cors.allowed-origin=${BACKOFFICE_APP_URL:http://localhost:3000}

spring.http.clients.connect-timeout=3s
spring.http.clients.read-timeout=30s
spring.http.clients.redirects=dont-follow

app.onboarding-service.url=${ONBOARDING_SERVICE_URL:}

app.security.jwt.public-key=${JWT_PUBLIC_KEY}
app.security.jwt.issuer=${JWT_ISSUER}
