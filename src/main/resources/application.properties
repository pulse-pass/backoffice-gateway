spring.application.name=backoffice-gateway

# JSON
spring.jackson.property-naming-strategy=SNAKE_CASE

# Messages
spring.messages.basename=messages
spring.messages.fallback-to-system-locale=false

# Actuator
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.probes.enabled=true

# CORS: origin of the backoffice application
app.cors.allowed-origin=${BACKOFFICE_APP_URL:http://localhost:3000}

# Timeouts applied by Spring Boot to the auto-configured RestClient.Builder
spring.http.clients.connect-timeout=3s
spring.http.clients.read-timeout=30s
# Redirects of the target service go back to the client untouched
spring.http.clients.redirects=dont-follow

# onboarding-service base URL (selected by infrastructure/service-start.sh)
app.onboarding-service.url=${ONBOARDING_SERVICE_URL:}
